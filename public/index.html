<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF0F6">
  <title>สมุดรายรับรายจ่าย</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎀</text></svg>">
  <link rel="preconnect" href="https://api.line.me">
  <link rel="preload" as="script" href="https://static.line-scdn.net/liff/edge/2/sdk.js">
  <script>
    // ใส่ธีมก่อนหน้าเว็บขึ้น กันจอกะพริบ
    try { var t = JSON.parse(localStorage.getItem('ie:theme')); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700&display=swap" onload="this.rel='stylesheet'">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <radialGradient id="pgBody" cx="35%" cy="28%" r="80%"><stop offset="0" stop-color="#FFE6F1"/><stop offset=".55" stop-color="#FFA2CB"/><stop offset="1" stop-color="#EE6AA2"/></radialGradient>
      <radialGradient id="pgHead" cx="38%" cy="26%" r="80%"><stop offset="0" stop-color="#FFEFF6"/><stop offset=".6" stop-color="#FFABD2"/><stop offset="1" stop-color="#F07CB0"/></radialGradient>
      <radialGradient id="pgSnout" cx="40%" cy="30%" r="75%"><stop offset="0" stop-color="#FFC4DE"/><stop offset="1" stop-color="#EE6AA2"/></radialGradient>
      <linearGradient id="pgLeg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC0DB"/><stop offset="1" stop-color="#F07CB0"/></linearGradient>
      <linearGradient id="pgBow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF7DB8"/><stop offset="1" stop-color="#E2307A"/></linearGradient>
      <radialGradient id="pgBlush"><stop offset="0" stop-color="#FF5F9E" stop-opacity=".7"/><stop offset="1" stop-color="#FF5F9E" stop-opacity="0"/></radialGradient>
    </defs>
  </svg>
  <div class="loader" id="loader">
    <div class="load-ava"><span id="loadEmoji">🎀</span><img id="loadImg" alt="" hidden><i class="ring"></i></div>
    <div class="load-text">กำลังโหลด<span class="dots"><i>.</i><i>.</i><i>.</i></span></div>
  </div>
  <script>
    // โชว์รูปโปรไฟล์ที่จำไว้ทันทีตอนโหลด
    try { var u = JSON.parse(localStorage.getItem('ie:user')); if (u && u.pic) { var im = document.getElementById('loadImg'); im.src = u.pic; im.hidden = false; document.getElementById('loadEmoji').hidden = true; } } catch (e) {}
  </script>

  <div id="app" class="app">
    <aside class="nav" id="nav">
      <div class="brand"><span class="brand-logo">🎀</span><span class="brand-name">รายรับรายจ่าย</span></div>
      <button class="nav-item" data-page="home"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>ภาพรวม</span></button>
      <button class="nav-item" data-page="list"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg><span>รายการ</span></button>
      <button class="nav-add" id="addBtn" aria-label="เพิ่มรายการ"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>เพิ่มรายการ</span></button>
      <button class="nav-item" data-page="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>ตั้งค่า</span></button>
    </aside>

    <main class="main">
      <header class="topbar">
        <img class="avatar" id="avatar" alt="" hidden>
        <div class="topbar-text">
          <div class="hello" id="hello">สวัสดี</div>
          <h1 class="title" id="pageTitle">ภาพรวม</h1>
        </div>
        <button class="icon-btn" id="themeBtn" aria-label="สลับโหมดมืด/สว่าง"></button>
      </header>

      <div class="scope" id="scope" hidden>
        <button data-scope="me">👤 ของฉัน</button>
        <button data-scope="us">💑 ของเรา</button>
        <span class="scope-pill"></span>
      </div>

      <div class="period" id="period">
        <div class="seg" role="tablist">
          <button data-mode="day">วัน</button>
          <button data-mode="month">เดือน</button>
          <button data-mode="year">ปี</button>
          <span class="seg-pill"></span>
        </div>
        <div class="stepper">
          <button id="prev" aria-label="ก่อนหน้า">‹</button>
          <button id="periodLabel" class="period-label"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span></span></button>
          <button id="next" aria-label="ถัดไป">›</button>
        </div>
      </div>

      <section id="view" class="view"></section>
    </main>
  </div>

  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  <div class="toast" id="toast"></div>

  <script src="/app.js" type="module"></script>
</body>
</html>
