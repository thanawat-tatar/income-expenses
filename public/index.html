  <script>
  // 🎬 ฉากเปิดม่านคริสต์มาส 2.65 วิ · โค้ดล้วน (SVG + canvas + CSS) · เล่นครั้งเดียวต่อเซสชัน · แตะข้ามได้ · จบแล้วลบ DOM + หยุด rAF ทั้งหมด
  (function () {
    var el = document.getElementById('holiday-magic-intro'); if (!el) return;
    var done = false, raf = 0, endT = 0, failT = 0;
    function cleanup() {
      try { if (raf) cancelAnimationFrame(raf); } catch (e) {} raf = 0;
      try { clearTimeout(endT); clearTimeout(failT); } catch (e) {}
      try { el.remove(); } catch (e) {}
      window.__introDone = true;
      try { window.dispatchEvent(new Event('intro:done')); } catch (e) {}
    }
    function exit(instant) {
      if (done) return; done = true;
      if (instant) return cleanup();
      try { el.classList.add('out'); } catch (e) {}
      setTimeout(cleanup, 440);
    }
    try {
      var played = false;
      try { played = !!sessionStorage.getItem('xmas_intro_played'); } catch (e) {}
      var rm = false; try { rm = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
      if (played || rm) { exit(true); return; }
      try { sessionStorage.setItem('xmas_intro_played', '1'); } catch (e) {}
      el.addEventListener('click', function () { exit(false); });
      el.addEventListener('touchstart', function () { exit(false); }, { passive: true });
      endT = setTimeout(function () { exit(false); }, 2650);
      failT = setTimeout(function () { exit(true); }, 3400);
      var cv = document.getElementById('intro-stardust-canvas'), ctx = cv.getContext('2d');
      var dpr = Math.min(window.devicePixelRatio || 1, 2), W = innerWidth, H = innerHeight;
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var COL = ['#FACC15', '#FEF08A', '#FFFFFF'], parts = [], t0 = 0, last = 0, bg = [];
      for (var q = 0; q < 20; q++) bg.push({ x: Math.random() * W, y: Math.random() * H * .85, r: .5 + Math.random() * .9, ph: Math.random() * 6.28, sp: 1.5 + Math.random() * 2.5 });
      var g = document.createElement('canvas'); g.width = g.height = 64;
      var gx = g.getContext('2d'), gr = gx.createRadialGradient(32, 32, 0, 32, 32, 32);
      gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.25, 'rgba(254,240,138,.9)'); gr.addColorStop(1, 'rgba(250,204,21,0)');
      gx.fillStyle = gr; gx.fillRect(0, 0, 64, 64);
      // เส้นโค้งพาราโบลา: ซ้ายล่าง → โค้งขึ้นเหนือชื่อแอป → ขวาบน
      var A = [-.05 * W, .9 * H], B = [1.05 * W, .1 * H], C = [.5 * W, -.22 * H];
      try { // ให้หางผ่านดาวดวงบนสุดของตรา (t=.5) พอดี
        var sr = el.querySelector('.intro-star').getBoundingClientRect();
        C = [2 * (sr.left + sr.width / 2) - .5 * (A[0] + B[0]), 2 * (sr.top + sr.height / 2) - .5 * (A[1] + B[1])];
      } catch (e) {}
      function P(t) { var u = 1 - t; return [u * u * A[0] + 2 * u * t * C[0] + t * t * B[0], u * u * A[1] + 2 * u * t * C[1] + t * t * B[1]]; }
      function flare(x, y, R, rot) { // ดาว 4 แฉกขาว-ทอง
        ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.fillStyle = '#FFFBEB';
        ctx.beginPath();
        for (var j = 0; j < 8; j++) { var rr = j % 2 ? R * .16 : (j % 4 ? R * .62 : R), an = j * Math.PI / 4; ctx.lineTo(Math.cos(an) * rr, Math.sin(an) * rr); }
        ctx.closePath(); ctx.fill(); ctx.restore();
      }
      function frame(ts) {
        raf = requestAnimationFrame(frame);
        if (!t0) t0 = ts; var t = (ts - t0) / 1000, dt = Math.min(.05, last ? (ts - last) / 1000 : .016); last = ts;
        ctx.clearRect(0, 0, W, H);
        for (var b = 0; b < bg.length; b++) { var s2 = bg[b]; ctx.globalAlpha = .12 + .38 * Math.abs(Math.sin(s2.ph + t * s2.sp)); ctx.fillStyle = '#FFF8E7'; ctx.beginPath(); ctx.arc(s2.x, s2.y, s2.r, 0, 6.2832); ctx.fill(); }
        ctx.globalAlpha = 1;
        var hd = null;
        if (t >= .3 && t <= 1.5) {
          hd = P((t - .3) / 1.2);
          for (var k = 0; k < 3 && parts.length < 150; k++) parts.push({ x: hd[0], y: hd[1], vx: (Math.random() - .5) * 34, vy: 14 + Math.random() * 46, l: 0, m: .9 + Math.random() * .6, s: 1.2 + Math.random() * 2.4, c: COL[(Math.random() * 3) | 0], w: Math.random() * 6.28 });
        }
        for (var i = parts.length - 1; i >= 0; i--) {
          var p = parts[i]; p.l += dt;
          if (p.l >= p.m) { parts.splice(i, 1); continue; }
          p.vy += 46 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
          ctx.globalAlpha = (1 - p.l / p.m) * (.45 + .55 * Math.abs(Math.sin(p.w + p.l * 13)));
          ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, 6.2832); ctx.fill();
        }
        ctx.globalAlpha = 1;
        if (hd) { ctx.drawImage(g, hd[0] - 24, hd[1] - 24, 48, 48); flare(hd[0], hd[1], 13, t * 1.6); }
      }
      raf = requestAnimationFrame(frame);
    } catch (e) { exit(true); }
  })();
